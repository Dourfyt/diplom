upstream platform_api {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    # Единая точка входа API комплекса
    location /api/ {
        proxy_pass http://platform_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # WebSocket (альтернативный путь /ws/monitoring)
    location /ws/ {
        proxy_pass http://platform_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # OpenAPI (Swagger)
    location /docs {
        proxy_pass http://platform_api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://platform_api/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://platform_api/openapi.json;
        proxy_set_header Host $host;
    }

    # Справка по модулям — редирект на лендинг
    location = / {
        return 302 http://runcourse.online/;
    }
}
