upstream platform_api {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    # Единая точка входа API комплекса
    location /api/ {
        proxy_pass http://platform_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # OpenAPI (Swagger)
    location /docs {
        proxy_pass http://platform_api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://platform_api/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://platform_api/openapi.json;
        proxy_set_header Host $host;
    }

    # Справка по модулям (статическая заглушка)
    location = / {
        default_type application/json;
        return 200 '{"service":"waste-complex-platform","docs":"/docs","api":"/api/health","planning_ui":"http://HOST:5173","eco_ui":"http://HOST:8001","modules":"/api/v1/core/modules"}';
        add_header Content-Type application/json;
    }
}
