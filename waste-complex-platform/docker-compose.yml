services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complex
      POSTGRES_PASSWORD: complex
      POSTGRES_DB: waste_complex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complex -d waste_complex"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://complex:complex@db:5432/waste_complex
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:3000
      FILE_STORAGE_ROOT: /app/storage
      ALLOW_PUBLIC_REGISTRATION: "true"
    volumes:
      - api_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  api_storage:
