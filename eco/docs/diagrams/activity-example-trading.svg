  <line x1="450" y1="287" x2="450" y2="343" stroke="#1a1a1a" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="666" y="376" width="168" height="44" rx="10" ry="10"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="750" y="392"><tspan x="750" dy="0">Отпустить товар</tspan></text>
  </text>

  <line x1="750" y1="420" x2="750" y2="456" stroke="#1a1a1a" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="666" y="448" width="168" height="44" rx="10" ry="10"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="750" y="458"><tspan x="750" dy="0">Подготовить товар</tspan><tspan x="750" dy="14">к отправке</tspan></text>
  </text>

  <line x1="750" y1="492" x2="750" y2="528" stroke="#1a1a1a" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="666" y="520" width="168" height="44" rx="10" ry="10"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="750" y="530"><tspan x="750" dy="0">Отправить товар</tspan><tspan x="750" dy="14">клиенту</tspan></text>
  </text>

  <line x1="450" y1="343" x2="750" y2="371" stroke="#1a1a1a" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="66" y="612" width="168" height="44" rx="10" ry="10"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="150" y="628"><tspan x="150" dy="0">Закрыть заказ</tspan></text>
  </text>

  <line x1="750" y1="600" x2="150" y2="612" stroke="#1a1a1a" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <circle cx="150" cy="686" r="14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="150" cy="686" r="8" fill="#1a1a1a"/>

  <line x1="150" y1="656" x2="150" y2="670" stroke="#1a1a1a" stroke-width="1.5"
        marker-end="url(#arrow)"/>
</svg>