<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — экологический учёт</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; background: #f4f9f4; }
    .login-card { max-width: 420px; border-radius: 1rem; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
  </style>
</head>
<body>
<div class="container">
  <div class="card login-card mx-auto border-0">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 fw-bold text-success mb-3">Вход в систему</h1>

      {% if form.errors %}
        <div class="alert alert-danger py-2 small">Неверный логин или пароль.</div>
      {% endif %}
      {% if error_message %}
        <div class="alert alert-danger py-2 small">{{ error_message }}</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        {% if use_api_auth %}
          <div class="mb-3">
            <label class="form-label" for="id_email">Email</label>
            <input type="email" name="email" id="id_email" class="form-control" required autofocus
                   value="{{ email|default:'' }}" autocomplete="username">
          </div>
        {% else %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Логин</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus
                   value="{{ form.username.value|default_if_none:'' }}">
          </div>
        {% endif %}
        <div class="mb-4">
          <label class="form-label" for="id_password">Пароль</label>
          <input type="password" name="password" id="id_password" class="form-control" required
                 autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-success w-100">Войти</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
