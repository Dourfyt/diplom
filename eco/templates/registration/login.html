{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — экологический учёт</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'eco/css/eco-ui.css' %}">
</head>
<body class="eco-login-page">
<div class="container">
  <div class="card eco-login-card mx-auto border-0">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 eco-page-title text-success mb-1">Вход в систему</h1>
      <p class="eco-page-lead mb-4">Эко-учёт отходов</p>

      {% if form.errors %}
        <div class="alert alert-danger py-2 small">Неверный логин или пароль.</div>
      {% endif %}
      {% if error_message %}
        <div class="alert alert-danger py-2 small">{{ error_message }}</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        {% if use_api_auth %}
          <div class="mb-3">
            <label class="form-label fw-semibold" for="id_email">Email</label>
            <input type="email" name="email" id="id_email" class="form-control form-control-lg" required autofocus
                   value="{{ email|default:'' }}" autocomplete="username">
          </div>
        {% else %}
          <div class="mb-3">
            <label class="form-label fw-semibold" for="id_username">Логин</label>
            <input type="text" name="username" id="id_username" class="form-control form-control-lg" required autofocus
                   value="{{ form.username.value|default_if_none:'' }}">
          </div>
        {% endif %}
        <div class="mb-4">
          <label class="form-label fw-semibold" for="id_password">Пароль</label>
          <input type="password" name="password" id="id_password" class="form-control form-control-lg" required
                 autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-success btn-lg w-100">Войти</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
