name: waste-stack

# Полный стек на одном сервере:
#   Лендинг + gateway (80) → runcourse.online
#   API (8080), планирование (5173), eco (8001) — обратная совместимость по IP
#
# Запуск из корня «Новая папка»:
#   docker compose -f docker-compose.stack.yml up -d --build

x-domain-api: &domain_api https://api.runcourse.online
x-domain-plan: &domain_plan https://plan.runcourse.online
x-domain-eco: &domain_eco https://eco.runcourse.online

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complex
      POSTGRES_PASSWORD: complex
      POSTGRES_DB: waste_complex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complex -d waste_complex"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./waste-complex-platform/api
    environment:
      DATABASE_URL: postgresql://complex:complex@db:5432/waste_complex
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-adminsdk.json
      CORS_ORIGINS: >-
        http://localhost:8080,
        http://localhost:5173,
        http://localhost:8001,
        http://178.57.217.79:8080,
        http://178.57.217.79:5173,
        http://178.57.217.79:8001,
        http://runcourse.online,
        http://www.runcourse.online,
        http://api.runcourse.online,
        http://plan.runcourse.online,
        http://eco.runcourse.online,
        https://runcourse.online,
        https://www.runcourse.online,
        https://api.runcourse.online,
        https://plan.runcourse.online,
        https://eco.runcourse.online
      JWT_SECRET: ${JWT_SECRET:-waste-complex-dev-secret-change-in-production}
      FILE_STORAGE_ROOT: /app/storage
      ALLOW_PUBLIC_REGISTRATION: "true"
    volumes:
      - api_storage:/app/storage
      - ./waste-complex-platform/api/secrets/firebase-adminsdk.json:/app/secrets/firebase-adminsdk.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./waste-complex-platform/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  planning:
    build:
      context: ./planning-module/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_MODULE_API_URL: *domain_api
        VITE_MODULE_PLANNING_URL: *domain_plan
        VITE_MODULE_ECO_URL: *domain_eco
    ports:
      - "5173:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  eco:
    build: ./eco
    ports:
      - "8001:8000"
    environment:
      USE_REMOTE_API: "true"
      USE_API_AUTH: "true"
      API_BASE_URL: http://api:8000
      API_TIMEOUT: "30"
      API_CONNECT_TIMEOUT: "10"
      DJANGO_SECRET_KEY: ${ECO_SECRET_KEY:-eco-change-me-in-production}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,178.57.217.79,eco,runcourse.online,www.runcourse.online,api.runcourse.online,plan.runcourse.online,eco.runcourse.online"
      MODULE_API_URL: *domain_api
      MODULE_PLANNING_URL: *domain_plan
      MODULE_ECO_URL: *domain_eco
      ECO_DEMO_PASSWORD: eco2026
      SQLITE_PATH: /app/sqlite/db.sqlite3
    volumes:
      - eco_sqlite:/app/sqlite
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  landing:
    build: ./landing
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${GATEWAY_NGINX_CONF:-./gateway/nginx.init.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      landing:
        condition: service_healthy
      api:
        condition: service_started
      planning:
        condition: service_healthy
      eco:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    profiles:
      - tools
    image: certbot/certbot:latest
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: certbot

volumes:
  pgdata:
  api_storage:
  eco_sqlite:
  certbot-webroot:
  certbot-certs:
