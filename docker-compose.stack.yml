name: waste-stack

# Полный стек на одном сервере:
#   API платформы (8080) + модуль планирования (5173) + модуль отчётности eco (8001)
#
# Запуск из корня «Новая папка»:
#   docker compose -f docker-compose.stack.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: complex
      POSTGRES_PASSWORD: complex
      POSTGRES_DB: waste_complex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complex -d waste_complex"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./waste-complex-platform/api
    environment:
      DATABASE_URL: postgresql://complex:complex@db:5432/waste_complex
      CORS_ORIGINS: >-
        http://localhost:8080,
        http://localhost:5173,
        http://localhost:8001,
        http://178.57.217.79:8080,
        http://178.57.217.79:5173,
        http://178.57.217.79:8001
      JWT_SECRET: ${JWT_SECRET:-waste-complex-dev-secret-change-in-production}
      FILE_STORAGE_ROOT: /app/storage
      ALLOW_PUBLIC_REGISTRATION: "true"
    volumes:
      - api_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./waste-complex-platform/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  planning:
    build:
      context: ./planning-module/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_MODULE_API_URL: http://178.57.217.79:8080
        VITE_MODULE_PLANNING_URL: http://178.57.217.79:5173
        VITE_MODULE_ECO_URL: http://178.57.217.79:8001
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  eco:
    build: ./eco
    ports:
      - "8001:8000"
    environment:
      USE_REMOTE_API: "true"
      USE_API_AUTH: "true"
      API_BASE_URL: http://api:8000
      API_TIMEOUT: "30"
      API_CONNECT_TIMEOUT: "10"
      DJANGO_SECRET_KEY: ${ECO_SECRET_KEY:-eco-change-me-in-production}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,178.57.217.79,eco"
      MODULE_API_URL: http://178.57.217.79:8080
      MODULE_PLANNING_URL: http://178.57.217.79:5173
      MODULE_ECO_URL: http://178.57.217.79:8001
      ECO_DEMO_PASSWORD: eco2026
      SQLITE_PATH: /app/sqlite/db.sqlite3
    volumes:
      - eco_sqlite:/app/sqlite
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  api_storage:
  eco_sqlite:
