# Fallback по IP (без HTTPS)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://landing_upstream;
        proxy_set_header Host $host;
    }
}
