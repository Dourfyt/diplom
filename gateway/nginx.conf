upstream landing_upstream {
    server landing:80;
}

upstream api_upstream {
    server api:8000;
}

upstream planning_upstream {
    server planning:80;
}

upstream eco_upstream {
    server eco:8000;
}

# Лендинг: runcourse.online
server {
    listen 80;
    server_name runcourse.online www.runcourse.online;

    client_max_body_size 100m;

    location / {
        proxy_pass http://landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API: api.runcourse.online
server {
    listen 80;
    server_name api.runcourse.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Планирование: plan.runcourse.online
server {
    listen 80;
    server_name plan.runcourse.online;

    location / {
        proxy_pass http://planning_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Отчётность: eco.runcourse.online
server {
    listen 80;
    server_name eco.runcourse.online;

    location / {
        proxy_pass http://eco_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Локальная разработка / fallback по IP без Host
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://landing_upstream;
        proxy_set_header Host $host;
    }
}
