# HTTPS-конфиг (после Certbot). Подключается через GATEWAY_NGINX_CONF=./gateway/nginx.conf

upstream landing_upstream {
    server landing:80;
}

upstream api_upstream {
    server api:8000;
}

upstream planning_upstream {
    server planning:80;
}

upstream eco_upstream {
    server eco:8000;
}

map $host $cert_name {
    default runcourse.online;
}

# ——— Лендинг ———

server {
    listen 80;
    server_name runcourse.online www.runcourse.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name runcourse.online www.runcourse.online;

    ssl_certificate /etc/letsencrypt/live/runcourse.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runcourse.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ——— API ———

server {
    listen 80;
    server_name api.runcourse.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.runcourse.online;

    ssl_certificate /etc/letsencrypt/live/runcourse.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runcourse.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location = /favicon.ico {
        proxy_pass http://landing_upstream/favicon.ico;
    }

    location = /favicon.svg {
        proxy_pass http://landing_upstream/favicon.svg;
    }

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

