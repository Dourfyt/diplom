# HTTPS + редирект. После Certbot: GATEWAY_NGINX_CONF=./gateway/nginx.conf
resolver 127.0.0.11 valid=10s ipv6=off;

# ——— Лендинг ———

server {
    listen 80;
    server_name runcourse.online www.runcourse.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name runcourse.online www.runcourse.online;

    ssl_certificate /etc/letsencrypt/live/runcourse.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runcourse.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        set $upstream http://landing:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ——— API ———

server {
    listen 80;
    server_name api.runcourse.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.runcourse.online;

    ssl_certificate /etc/letsencrypt/live/runcourse.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runcourse.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location = /favicon.ico {
        set $upstream http://landing:80;
        proxy_pass $upstream/favicon.ico;
    }

    location = /favicon.svg {
        set $upstream http://landing:80;
        proxy_pass $upstream/favicon.svg;
    }

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

