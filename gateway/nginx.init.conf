# Fallback по IP
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $upstream http://landing:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
}
