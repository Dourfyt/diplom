# Docker DNS: не кэшировать IP upstream при пересоздании контейнеров
resolver 127.0.0.11 valid=10s ipv6=off;

# ——— Лендинг ———

server {
    listen 80;
    server_name runcourse.online www.runcourse.online;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $upstream http://landing:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ——— API ———

server {
    listen 80;
    server_name api.runcourse.online;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /favicon.ico {
        set $upstream http://landing:80;
        proxy_pass $upstream/favicon.ico;
    }

    location = /favicon.svg {
        set $upstream http://landing:80;
        proxy_pass $upstream/favicon.svg;
    }

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

