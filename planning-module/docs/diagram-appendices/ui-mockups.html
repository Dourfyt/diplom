<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Макеты интерфейса planning-module</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background:#f1f5f9; }
    h1 { font-size: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1400px; }
    .card { background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:14px; }
    .title { font-weight:bold; margin-bottom:8px; }
    .bar { height: 14px; background:#e2e8f0; border-radius: 4px; margin: 6px 0; }
    .gant { display:grid; grid-template-columns: 140px repeat(8, 1fr); gap:4px; align-items:center; }
    .cell { height:26px; background:#f8fafc; border:1px solid #e2e8f0; }
    .task { background:#bfdbfe; border:1px solid #60a5fa; }
    .kpi { display:flex; gap:8px; }
    .kpi .box { flex:1; background:#ecfeff; border:1px solid #67e8f9; padding:10px; text-align:center; }
  </style>
</head>
<body>
  <h1>Макеты интерфейса: Gantt-диаграмма и дашборд</h1>
  <div class="grid">
    <div class="card">
      <div class="title">Экран «Планирование смены» (Gantt)</div>
      <div class="gant">
        <div>Линия L1</div><div class="cell task"></div><div class="cell task"></div><div class="cell"></div><div class="cell task"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div>Линия L2</div><div class="cell"></div><div class="cell task"></div><div class="cell task"></div><div class="cell"></div><div class="cell"></div><div class="cell task"></div><div class="cell"></div><div class="cell"></div>
        <div>Линия L3</div><div class="cell"></div><div class="cell"></div><div class="cell task"></div><div class="cell task"></div><div class="cell"></div><div class="cell"></div><div class="cell task"></div><div class="cell"></div>
      </div>
      <div class="bar"></div><div class="bar"></div>
    </div>
    <div class="card">
      <div class="title">Экран «Оперативный дашборд»</div>
      <div class="kpi">
        <div class="box">Загрузка: 84%</div>
        <div class="box">Просрочки: 1</div>
        <div class="box">Простой: 38 мин</div>
      </div>
      <div class="bar" style="width:95%"></div>
      <div class="bar" style="width:82%"></div>
      <div class="bar" style="width:76%"></div>
      <div class="bar" style="width:66%"></div>
      <div class="bar" style="width:58%"></div>
    </div>
  </div>
</body>
</html>
