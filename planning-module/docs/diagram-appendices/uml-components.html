<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UML Компоненты planning-module</title>
  <link rel="stylesheet" href="appendix-viewer.css" />
</head>
<body>
  <h1>Приложение В. UML-диаграмма компонентов</h1>
  <p class="subtitle">ISO/IEC 19519 · PlantUML · файл <code>uml-components.puml</code></p>

  <section class="panel">
    <h2>Исходный код (PlantUML)</h2>
    <pre class="source" id="source"></pre>
    <p class="note">Рендер: <a href="https://www.plantuml.com/plantuml" target="_blank" rel="noopener">plantuml.com</a>, VS Code PlantUML, Kroki. Нотация: —○ provided, )— required.</p>
  </section>

  <section class="panel">
    <h2>Предпросмотр</h2>
    <div class="canvas plantuml-canvas">
      <img id="preview" alt="UML Component Diagram" />
    </div>
  </section>

  <script type="module">
    import { encode } from "https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js";
    const code = await (await fetch("uml-components.puml")).text();
    document.getElementById("source").textContent = code;
    document.getElementById("preview").src =
      "https://www.plantuml.com/plantuml/svg/" + encode(code);
  </script>
</body>
</html>
